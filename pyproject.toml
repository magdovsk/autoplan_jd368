[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magdovsk-autoplan_jd368"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别自动驾驶规划控制专家·线上分布漂移的检测上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "magdovsk" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://magdovsk.github.io"
Repository = "https://github.com/magdovsk/autoplan_jd368"
Issues = "https://github.com/magdovsk/autoplan_jd368/issues"

[project.scripts]
autoplan_jd368 = "autoplan_jd368:main"

[tool.setuptools]
py-modules = ["autoplan_jd368"]
